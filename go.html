<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>جارٍ فتح الرابط</title>
<style>
:root{--bg:#f4f8fd;--ink:#102036;--muted:#5b6b82;--brand:#0b6fc4}
@media (prefers-color-scheme:dark){:root{--bg:#0d1522;--ink:#eaf0f8;--muted:#9fb0c6;--brand:#42a5f5}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Sakkal Majalla","Noto Naskh Arabic",system-ui,sans-serif;font-size:20px;text-align:center;padding:16px}
a{color:var(--brand)} p{margin:6px 0} .m{color:var(--muted);font-size:16px}
</style>
</head>
<body>
<main><p id="msg">جارٍ فتح الرابط…</p><p class="m" id="alt"></p></main>
<script>
(function(){
  var to=new URLSearchParams(location.search).get('to')||'', ok=false, u=null;
  try{ u=new URL(to); ok=u.protocol==='https:'&&/(^|\.)linkedin\.com$/i.test(u.hostname); }catch(e){}
  if(!ok){ document.getElementById('msg').textContent='الرابط غير صالح.'; return; }
  var a=document.createElement('a'); a.href=u.href; a.textContent='اضغط هنا إذا لم يُفتح تلقائياً'; a.rel='noopener';
  document.getElementById('alt').appendChild(a);
  location.replace(u.href);
})();
</script>
</body>
</html>
